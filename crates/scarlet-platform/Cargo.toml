[package]
name = "scarlet-platform"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Scarlet Native filesystem operations not yet exposed by std"

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-abi = { git = "https://github.com/petitstrawberry/Scarlet", rev = "3b1b3a32251f6d332765f885ea4fb24a57fd167a" }
scarlet-sys = { git = "https://github.com/petitstrawberry/Scarlet", rev = "3b1b3a32251f6d332765f885ea4fb24a57fd167a" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }
